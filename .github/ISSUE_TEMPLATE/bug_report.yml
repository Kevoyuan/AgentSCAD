name: Bug Report
description: Report unexpected behavior, rendering failures, or crashes in AgentSCAD
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Fill in as much detail as you can.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of AgentSCAD is affected?
      options:
        - CAD Generation (LLM → OpenSCAD)
        - OpenSCAD Rendering (STL/PNG)
        - Validation (wall thickness, manifold, etc.)
        - Repair Pipeline (auto-repair or visual repair)
        - UI / Workspace
        - Database / Persistence
        - API Routes
        - Benchmark / Eval scripts
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the unexpected behavior.
      placeholder: "When I create a job with '...', the pipeline stops at GEOMETRY_FAILED even though OpenSCAD is installed."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "The job should complete with a rendered STL artifact."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Start the app with `bun run dev`
        2. Create a new job with input "..."
        3. Click Process
        4. See the error in the pipeline status panel
    validations:
      required: true

  - type: input
    id: openscad_version
    attributes:
      label: OpenSCAD version
      description: Run `openscad --version` to get this.
      placeholder: "OpenSCAD 2021.01 (git 78850c0)"

  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: "22.2.0"

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux (Ubuntu/Debian)
        - Linux (other)
        - Windows
        - Windows (WSL)
        - Docker

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Paste error output from the browser console, terminal, or pipeline status panel.
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I ran `bun run test` and existing tests pass
        - label: I checked the [Troubleshooting guide](https://github.com/Kevoyuan/AgentSCAD/blob/main/docs/TROUBLESHOOTING.md)
        - label: I searched existing issues and this is not a duplicate
