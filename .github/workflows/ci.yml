name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # nightly benchmark fast lane (cheap families + schema tests)
    - cron: "0 3 * * 1"   # weekly full thirteen-family benchmark gate

permissions:
  contents: read

jobs:
  core:
    name: Core CI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "file:./db/dev.db"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare database
        run: |
          mkdir -p db
          touch db/dev.db
          bun run db:generate
          bun run db:push

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        env:
          AGENTSCAD_MESH_VALIDATOR_PYTHON: /tmp/agentscad-mesh-ci/bin/python
        run: |
          python3 -m venv /tmp/agentscad-mesh-ci
          /tmp/agentscad-mesh-ci/bin/python -m pip install 'trimesh>=4,<5' numpy scipy rtree 'networkx>=3'
          bun run test:unit

      - name: Benchmark schema tests (fast)
        run: bun test bench/

      - name: License audit
        run: bun run runtime:openscad:install && bun run license:audit

      - name: OpenSCAD WASM integration
        run: bun run test:wasm

      - name: Build
        run: bun run build

      - name: Standalone WASM packaging smoke test
        run: |
          test -f .next/standalone/.openscad-runtime/COPYING
          test -f .next/standalone/.openscad-runtime/metadata.json
          test -f .next/standalone/scripts/openscad-wasm-sandbox.cjs
          mkdir -p /tmp/agentscad-wasm-sandbox
          printf 'cube(2);\n' | (
            cd /tmp/agentscad-wasm-sandbox
            node --max-old-space-size=384 \
              --wasm-max-mem-pages=4096 \
              --wasm-max-committed-code-mb=128 \
              --require "$GITHUB_WORKSPACE/.next/standalone/scripts/openscad-wasm-sandbox.cjs" \
              "$GITHUB_WORKSPACE/.next/standalone/.openscad-runtime/openscad.js" \
              --export-format binstl -o - - > /tmp/agentscad-wasm-smoke.stl
          )
          test "$(wc -c < /tmp/agentscad-wasm-smoke.stl)" -gt 84

  openscad-integration:
    name: OpenSCAD Integration
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "file:./db/dev.db"
      OPENSCAD_BIN: "openscad"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install OpenSCAD and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb python3 python3-pip
          python3 -m pip install --break-system-packages 'trimesh>=4,<5' numpy scipy rtree 'networkx>=3'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare database
        run: |
          mkdir -p db
          touch db/dev.db
          bun run db:generate
          bun run db:push

      - name: Run OpenSCAD integration tests
        run: xvfb-run -a bun run test:openscad

      - name: Benchmark smoke for changed families
        env:
          BENCH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: xvfb-run -a bun scripts/ci/bench-smoke-changed.ts

  bench-nightly:
    name: Benchmark Nightly Fast Lane
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Install OpenSCAD and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          bun install --frozen-lockfile

      - name: Benchmark schema tests
        run: bun test bench/

      - name: Benchmark fast lane (assembly, gear, cam, planetary, planetary3)
        run: |
          for family in assembly gear cam planetary planetary3; do
            xvfb-run -a bun "bench/${family}/run.ts" --submission reference
          done

  bench-family:
    name: Benchmark Family (${{ matrix.name }})
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: assembly
            command: bun bench/assembly/run.ts --self-check
            report: bench/assembly/report.json
          - name: gear
            command: bun bench/gear/run.ts --self-check
            report: bench/gear/report.json
          - name: slider
            command: bun bench/slider/run.ts --self-check
            report: bench/slider/report.json
          - name: l4
            command: bun bench/l4/run.ts --self-check
            report: bench/l4/report.json
          - name: twin
            command: bun bench/twin/run.ts --self-check
            report: bench/twin/report.json
          - name: vtwin
            command: bun bench/vtwin/run.ts --self-check
            report: bench/vtwin/report.json
          - name: declaration
            command: bun bench/declaration/run.ts --self-check
            report: bench/declaration/report.json
          - name: planetary
            command: bun bench/planetary/run.ts --self-check
            report: bench/planetary/report.json
          - name: planetary3
            command: bun bench/planetary3/run.ts --self-check
            report: bench/planetary3/report.json
          - name: cam
            command: bun bench/cam/run.ts --self-check
            report: bench/cam/report.json
          - name: v8-phase
            command: bun bench/v8/run.ts --task v8-phase-8 --self-check
            report: bench/v8/report.json
          - name: v8-block
            command: bun bench/v8/run.ts --task v8-block-bearings-8 --self-check
            report: bench/v8/report.json
          - name: v8-bored
            command: bun bench/v8/run.ts --task v8-bored-8 --self-check
            report: bench/v8/report.json
          - name: thread
            command: bun bench/thread/run.ts --self-check
            report: bench/thread/report.json
          - name: product
            command: bun bench/product/run.ts --self-check
            report: bench/product/report.json

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Install OpenSCAD and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          bun install --frozen-lockfile

      - name: Benchmark family self-check
        run: xvfb-run -a ${{ matrix.command }}

      - name: Upload family report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-report-${{ matrix.name }}
          path: ${{ matrix.report }}
          if-no-files-found: warn

  bench-full-serial:
    name: Benchmark Full Serial Publication
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Install OpenSCAD and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          bun install --frozen-lockfile

      - name: Benchmark schema tests
        run: bun test bench/

      - name: Thirteen-family benchmark gate
        run: xvfb-run -a bun run bench:all

      - name: Upload benchmark matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-matrix
          path: bench/matrix.json
          if-no-files-found: warn
